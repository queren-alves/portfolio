<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Quéren Alves">
    <meta name="description" content="Portfólio da Quéren Alves, desenvolvedor Full Stack. Conheça meus projetos e entre em contato.">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <title>Portfólio da Quéren</title>
</head>
<body> 
    <header class="flex menu_container">
        <article class="menu_content">
            <div id="titulo">
                <a href="#">Portfólio</a>
            </div>
            <nav>
                <ul class="flex menu_list">
                    <li><a href="#hero">Início</a></li>
                    <li><a href="#about">Sobre</a></li>
                    <li><a href="#contact">Contato</a></li>
                </ul>
            </nav>
        </article>
    </header>

    <main>
        <section id="hero" class="hero_container">
            <article class="hero_content">
                <h4>👋 Olá, eu sou Quéren</h4>
                <h1>Desenvolvedora Full Stack</h1>
                <p>Transformo ideias em código e crio experiências digitais incríveis.</p>
                <div class="hero_buttons">
                    <a href="#contact" class="botao">Entre em Contato</a>
                    <a href="#about" class="botao-outline">Saiba Mais...</a>
                </div>
            </article>
            <figure class="hero_image">
                <img src="assets/img/dev_woman.svg" alt="Ilustração com uma pessoa desenvolvedora escrevendo código." class="ilustracao float-animation">
            </figure>
        </section>

        <section id="about" class="about_container">
            
        </section>

        <section id="contact" class="contact_container">
            <article class="contact_info">
                <h4>Entre em Contato</h4>
                <p>Sinta-se à vontade para entrar em contato comigo.</p>
                <div class="social_container">
                    <a href="https://www.linkedin.com/in/querenhalves/" target="_blank" class="social_icon">
                        <img src="assets/img/linkedin.svg" alt="Link para o Linkedin">
                    </a>
                    <a href="https://github.com/queren-alves/" target="_blank" class="social_icon">
                        <img src="assets/img/github.svg" alt="Link para o GitHub">
                    </a>
                </div>
            </article>
            <form id="formulario">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" placeholder="Digite seu nome completo">
                <span id="txtNome"></span>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="Digite seu e-mail">
                <span id="txtEmail"></span>

                <label for="assunto">Assunto</label>
                <input id="assunto" name="assunto" type="text" placeholder="Digite o assunto da mensagem">
                <span id="txtAssunto"></span>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Digite a sua mensagem aqui..."></textarea>
                
                <button class="botao" type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        Feito com ❤️ por Quéren Alves - 2025
    </footer>
    <script src="assets/js/scripts.js"></script>
</body>
</html>
